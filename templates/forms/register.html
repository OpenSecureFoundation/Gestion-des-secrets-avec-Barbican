{% extends "base_auth.html" %}

{% load static %}

{% block content %}
<div id="auth-display" class="auth-page">
  <div class="auth-card">

    <img src="{% static 'img/logo.png' %}" alt="BarbiLink" class="auth-logo">
    <h2 class="auth-title">Créer un compte</h2>

    {% if error %}
      <div class="alert alert-danger py-2 px-3 mb-3" role="alert">
        <i class="fas fa-exclamation-circle me-2"></i>{{ error }}
      </div>
    {% endif %}

    <form hx-post="{% url 'accounts:register' %}"
          hx-push-url="true"
          hx-target="#auth-display"
          onsubmit="return validatePasswords()">
      {% csrf_token %}

      <div class="row g-3 mb-0">
        <div class="col-6">
          <div class="auth-field mb-0">
            <label for="first_name">Prénom(s)</label>
            <input type="text"
                   id="first_name"
                   name="first_name"
                   class="form-control"
                   placeholder="Prénom(s)"
                   value="{{ form_data.first_name }}"
                   required>
          </div>
        </div>
        <div class="col-6">
          <div class="auth-field mb-0">
            <label for="last_name">Nom(s)</label>
            <input type="text"
                   id="last_name"
                   name="last_name"
                   class="form-control"
                   placeholder="Nom(s)"
                   value="{{ form_data.last_name }}"
                   required>
          </div>
        </div>
      </div>

      <div class="auth-field" style="margin-top: 18px;">
        <label for="username">Pseudonyme</label>
        <input type="text"
               id="username"
               name="username"
               class="form-control"
               placeholder="Votre pseudonyme"
               value="{{ form_data.username }}"
               required>
      </div>

      <div class="auth-field">
        <label for="email">Adresse mail</label>
        <input type="email"
               id="email"
               name="email"
               class="form-control"
               placeholder="nom@exemple.com"
               value="{{ form_data.email }}"
               required>
      </div>

      <div class="auth-field">
        <label for="password">Mot de passe</label>
        <div class="auth-pw-wrapper">
          <input type="password"
                 id="password"
                 name="password"
                 class="form-control"
                 placeholder="Votre mot de passe"
                 value="{{ form_data.password }}"
                 required>
          <span class="toggle-pw" onclick="togglePassword('password', this)">
            <i class="fas fa-eye"></i>
          </span>
        </div>
      </div>

      <div class="auth-field">
        <label for="confirm_password">Confirmer le mot de passe</label>
        <div class="auth-pw-wrapper">
          <input type="password"
                 id="confirm_password"
                 name="confirm_password"
                 class="form-control"
                 placeholder="Répéter le mot de passe"
                 value="{{ form_data.confirm_password }}"
                 required>
          <span class="toggle-pw" onclick="togglePassword('confirm_password', this)">
            <i class="fas fa-eye"></i>
          </span>
        </div>
      </div>

      <div id="password-error"
           class="alert alert-danger py-1 px-3 small mb-3"
           style="display:none;">
        <i class="fas fa-exclamation-circle me-1"></i>Les mots de passe ne correspondent pas.
      </div>

      <button type="submit" class="btn auth-btn">
        S'inscrire
      </button>
    </form>

    <p class="auth-footer">
      Déjà un compte ?
      <span class="barbi-link"
            hx-get="{% url 'accounts:login' %}"
            hx-push-url="true"
            hx-target="#auth-display">
        Se connecter
      </span>
    </p>

  </div>
</div>

<script>
function validatePasswords() {
  const pass    = document.getElementById('password').value;
  const confirm = document.getElementById('confirm_password').value;
  const errDiv  = document.getElementById('password-error');
  if (pass !== confirm) {
    errDiv.style.display = 'block';
    return false;
  }
  errDiv.style.display = 'none';
  return true;
}

function togglePassword(inputId, element) {
  const input = document.getElementById(inputId);
  const icon  = element.querySelector('i');
  if (input.type === 'password') {
    input.type = 'text';
    icon.classList.replace('fa-eye', 'fa-eye-slash');
  } else {
    input.type = 'password';
    icon.classList.replace('fa-eye-slash', 'fa-eye');
  }
}
</script>
{% endblock %}
