
{% if error %}
    <div class="alert alert-danger">{{ error }}</div>
{% endif %}
      
<form hx-post="{% url 'accounts:delete_user' %}">
    {% csrf_token %}
    <div class="mb-4 position-relative">
        <input type="password" name="password" id="confirm_pass" 
                class="form-control text-center" 
                style="border: 2px solid #8b008b; border-radius: 10px; height: 50px;"
                required>
    </div>
    
    <div class="text-center">
        <button type="submit" class="btn text-white px-5 py-2 fw-bold" 
                style="background-color: #4a0e4e; border-radius: 25px;">
            <a href="{% url 'accounts:login' %}" style="text-decoration: none; color: inherit; cursor: default;">
                confirmer
            </a>
        </button>
    </div>
    <div class="text-center mt-3">
        <a href="{% url 'accounts:profile' %}" class="text-muted small">Annuler</a>
    </div>
</form>
