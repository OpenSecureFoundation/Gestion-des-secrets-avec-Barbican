<div id="profile-section">
    <div class="bg-white p-4 rounded-4 shadow-sm mb-4">
        <h5 class="mb-3">Modifier mon identité</h5>
        <hr>

        {% if error_message %}
            <div class="alert alert-danger alert-dismissible fade show barbi-alert" role="alert">
                <i class="fas fa-exclamation-circle me-2"></i>{{ error_message }}
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>
        {% elif success_message %}
            <div class="alert alert-success alert-dismissible fade show barbi-alert" role="alert">
                <i class="fas fa-check-circle me-2"></i>{{ success_message }}
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>
        {% endif %}

        <form hx-post="{% url 'accounts:change_identite' %}" hx-target="#profile-section" hx-swap="outerHTML">
            {% csrf_token %}
            <div class="row g-3">
                <div class="col-12">
                    <label class="form-label">Prénom :</label>
                    <input type="text" name="first_name" class="form-control" value="{{ user.first_name }}">
                </div>
                <div class="col-12">
                    <label class="form-label">Nom :</label>
                    <input type="text" name="last_name" class="form-control" value="{{ user.last_name }}">
                </div>
                <div class="col-12">
                    <label class="form-label">Pseudonyme :</label>
                    <input type="text" name="username" class="form-control" value="{{ user.username }}">
                </div>
                <div class="col-12">
                    <label class="form-label">Adresse mail :</label>
                    <input type="email" name="email" class="form-control" value="{{ user.email }}">
                </div>
            </div>
            <div class="d-flex justify-content-end mt-3">
                <button type="submit" class="btn btn-purple">Modifier</button>
            </div>
        </form>
    </div>
</div>
