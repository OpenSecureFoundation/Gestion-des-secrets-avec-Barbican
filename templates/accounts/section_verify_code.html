<div id="{{ section_id }}">
    <div class="bg-white p-4 rounded-4 shadow-sm mb-4">

        <div class="d-flex align-items-center gap-3 mb-3">
            <div class="rounded-circle d-flex align-items-center justify-content-center flex-shrink-0"
                 style="width:48px; height:48px; background:#f8f0fb;">
                <i class="fas fa-envelope" style="color:#4a0e4e; font-size:1.25rem;"></i>
            </div>
            <div>
                <h5 class="mb-0 fw-bold">Vérification par e-mail</h5>
                <p class="text-muted small mb-0">Un code à 6 chiffres a été envoyé à <strong>{{ user_email }}</strong></p>
            </div>
        </div>

        <hr>

        {% if error %}
            <div class="alert alert-danger alert-dismissible fade show barbi-alert" role="alert">
                <i class="fas fa-exclamation-circle me-2"></i>{{ error }}
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>
        {% endif %}

        <p class="text-muted small mb-4">
            <i class="fas fa-info-circle me-1"></i>
            Vérifiez votre boîte de réception (et les spams). Ce code est valable <strong>10 minutes</strong>.
        </p>

        <form hx-post="{{ verify_url }}"
              hx-target="#{{ section_id }}"
              hx-swap="outerHTML">
            {% csrf_token %}

            <div class="mb-4">
                <label class="form-label fw-semibold">Code de vérification</label>
                <input type="text"
                       name="verif_code"
                       class="form-control text-center fw-bold barbi-input"
                       maxlength="6"
                       pattern="\d{6}"
                       placeholder="_ _ _ _ _ _"
                       autocomplete="one-time-code"
                       autofocus
                       required
                       style="font-size: 1.8rem; letter-spacing: 0.6rem; max-width: 240px;">
                <div class="form-text">Entrez les 6 chiffres reçus par e-mail.</div>
            </div>

            <div class="d-flex gap-2 justify-content-end">
                <button type="submit" class="btn btn-purple px-4">
                    <i class="fas fa-check me-2"></i>Confirmer
                </button>
                <button type="button"
                        class="btn btn-outline-secondary"
                        onclick="window.history.back()">
                    Annuler
                </button>
            </div>
        </form>

    </div>
</div>
