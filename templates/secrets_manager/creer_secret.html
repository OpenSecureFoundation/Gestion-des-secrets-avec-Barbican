{% extends "base.html" %}

{% load static %}

{% block content %}

    {% include "secrets_manager/creer_secret_partiel.html" %}

{% endblock %}

{% block extra_js %}
<script>

  // ── Affichage du panel selon le type de secret ──
  document.querySelectorAll('input[name="type_secret"]').forEach(radio => {
    radio.addEventListener('change', () => {
      const panelApi = document.getElementById('panel-api');
      const panelSsl = document.getElementById('panel-ssl');

      if (radio.value === 'api') {
        panelApi.classList.remove('d-none');
        panelSsl.classList.add('d-none');
      } else {
        panelApi.classList.add('d-none');
        panelSsl.classList.remove('d-none');
      }
    });
  });

  // ── Clé unique vs paire de clés ──
  document.querySelectorAll('input[name="api_type"]').forEach(radio => {
    radio.addEventListener('change', () => {
      const isUnique = radio.value === 'unique';
      document.getElementById('upload-unique').style.display = isUnique ? 'block' : 'none';
      document.getElementById('upload-paire').style.display  = isUnique ? 'none'  : 'flex';
    });
  });

  // ── Tabs upload / générer ──
  function switchTab(panel, tab, btn) {
    // Désactiver tous les boutons du groupe
    btn.closest('ul').querySelectorAll('.nav-link').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');

    // Masquer tous les tab-content-panel du panel
    document.querySelectorAll(`#panel-${panel} .tab-content-panel`).forEach(el => {
      el.classList.add('d-none');
    });

    // Afficher le bon onglet
    const target = document.getElementById(`${panel}-${tab}`);
    if (target) target.classList.remove('d-none');

    // Mémoriser l'onglet actif dans le champ caché
    const hiddenInput = document.getElementById(`${panel}_action_input`);
    if (hiddenInput) hiddenInput.value = tab;
  }

</script>
{% endblock %}
