<div style="display:flex; align-items:center; justify-content:center; min-height:70vh; padding:2rem 1rem;">
  <div style="background:#fff; border-radius:16px; box-shadow:0 6px 32px rgba(74,14,78,.12); padding:2.5rem 2rem; max-width:460px; width:100%; text-align:center;">

    <h4 style="font-weight:700; margin-bottom:0.5rem;">Application ajoutée avec succès !</h4>
    <p style="color:#6b7280; font-size:0.95rem; margin-bottom:1.75rem;">
      L'application <strong>{{ app_nom }}</strong> est prête.<br>
      Voulez-vous lui ajouter un secret maintenant ?
    </p>

    <div style="display:flex; justify-content:center; align-items:center; gap:1rem; flex-wrap:wrap;">
      <a hx-get="{% url 'secrets_manager:ajouter_secret' %}?projet_id={{ projet_id }}"
         hx-target="#main-display"
         hx-push-url="true"
         style="background:#4a0e4e; color:#fff; font-weight:700; font-size:0.82rem; letter-spacing:0.05em; text-transform:uppercase; padding:0.55rem 1.6rem; border-radius:8px; border:none; text-decoration:none; cursor:pointer; display:inline-block; transition:background .2s;"
         onmouseenter="this.style.background='#7b1fa2'"
         onmouseleave="this.style.background='#4a0e4e'">
        Ajouter un secret
      </a>

      <form hx-post="{% url 'secrets_manager:passer_secret' %}" hx-swap="none" style="display:inline;">
        {% csrf_token %}
        <button type="submit"
                style="background:transparent; border:none; color:#6b7280; font-weight:600; font-size:0.88rem; cursor:pointer; padding:0.55rem 0.5rem; transition:color .2s;"
                onmouseenter="this.style.color='#374151'"
                onmouseleave="this.style.color='#6b7280'">
          Passer
        </button>
      </form>
    </div>

  </div>
</div>
