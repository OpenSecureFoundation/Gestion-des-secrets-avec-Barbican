<!-- proposition_secret.html -->
{% extends "base.html" %}
{% block content %}

<div class="container mt-5" style="max-width: 560px;">
  <div class="card shadow-sm border-0">
    <div class="card-body text-center p-5">

      <h4 class="fw-bold mb-2">Application ajoutée avec succès !</h4>
      <p class="text-muted mb-4">
        L'application <strong>{{ app_nom }}</strong> est prête.<br/>
        Voulez-vous lui ajouter un secret maintenant ?
      </p>

      <div class="d-flex justify-content-center gap-3">

        <!-- Ajouter un secret → formulaire avec projet_id prérempli -->
        <a href="{% url 'secrets_manager:ajouter_secret' %}?projet_id={{ projet_id }}"
           class="btn btn-primary px-4">
          Ajouter un secret
        </a>

        <!-- Passer → nettoie la session et redirige -->
        <a href="{% url 'secrets_manager:passer_secret' %}"
           class="btn btn-outline-secondary px-4">
          Passer
        </a>

      </div>
    </div>
  </div>
</div>

{% endblock %}
