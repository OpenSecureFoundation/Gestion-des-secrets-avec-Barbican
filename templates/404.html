{% load static %}
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 – Page introuvable | BarbiLink</title>

  <link rel="stylesheet" href="{% static 'css/bootstrap.min.css' %}">
  <link rel="stylesheet" href="{% static 'css/all.min.css' %}">

  <style>
    body {
      background: #fdfaff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      text-align: center;
      padding: 24px;
    }

    .error-logo {
      width: 110px;
      margin-bottom: 32px;
    }

    .error-code {
      font-size: 7rem;
      font-weight: 900;
      line-height: 1;
      background: linear-gradient(135deg, #4a0e4e 0%, #9c27b0 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 16px;
    }

    .error-title {
      font-size: 1.6rem;
      font-weight: 700;
      color: #2d0030;
      margin-bottom: 12px;
    }

    .error-desc {
      color: #888;
      font-size: 0.95rem;
      max-width: 420px;
      line-height: 1.6;
      margin-bottom: 36px;
    }

    .btn-home {
      background: linear-gradient(135deg, #4a0e4e 0%, #7b1fa2 100%);
      color: white !important;
      border: none;
      border-radius: 25px;
      padding: 12px 36px;
      font-size: 15px;
      font-weight: 600;
      text-decoration: none;
      transition: opacity 0.2s ease, transform 0.1s ease;
      display: inline-block;
    }

    .btn-home:hover {
      opacity: 0.9;
      transform: translateY(-1px);
    }

    .divider {
      width: 48px;
      height: 4px;
      background: linear-gradient(135deg, #4a0e4e, #9c27b0);
      border-radius: 2px;
      margin: 0 auto 28px;
    }
  </style>
</head>
<body>

  <img src="{% static 'img/logo.png' %}" alt="BarbiLink" class="error-logo">

  <div class="error-code">404</div>

  <div class="divider"></div>

  <h1 class="error-title">Page introuvable</h1>

  <p class="error-desc">
    Désolé, la page que vous recherchez n'existe pas ou a été déplacée.
  </p>

  <a href="{% url 'apps_manager:dashboard' %}" class="btn-home">
    <i class="fas fa-home me-2"></i>Retour au tableau de bord
  </a>

</body>
</html>
